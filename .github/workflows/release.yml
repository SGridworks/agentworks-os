name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so a maintainer can re-run a failed release without
  # cutting a new tag — useful when the workflow itself was the bug.
  # Pick the tag from the GitHub UI's "Use workflow from" branch dropdown,
  # or pass a tag/sha to check out.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit SHA to release (defaults to the workflow's source ref)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/agentworks

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # needed for cosign OIDC federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      # ------------------------------------------------------------------
      # Metadata for agentos-d
      # ------------------------------------------------------------------
      - name: Extract metadata for agentos-d
        id: meta-agentos-d
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/agentos-d
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # ------------------------------------------------------------------
      # Metadata for scanner-worker
      # ------------------------------------------------------------------
      - name: Extract metadata for scanner-worker
        id: meta-scanner-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/scanner-worker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # ------------------------------------------------------------------
      # Metadata for admin-ui
      # ------------------------------------------------------------------
      - name: Extract metadata for admin-ui
        id: meta-admin-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/admin-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Build and push agentos-d
      # ------------------------------------------------------------------
      - name: Build and push agentos-d
        id: push-agentos-d
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/agentos-d/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-agentos-d.outputs.tags }}
          labels: ${{ steps.meta-agentos-d.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign agentos-d with Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign and attest agentos-d images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "COSIGN_PRIVATE_KEY not set — skipping signing for agentos-d (image is published unsigned)."
            exit 0
          fi
          echo "$COSIGN_PRIVATE_KEY" | cosign sign --yes --key - \
            ${{ env.IMAGE_PREFIX }}/agentos-d:${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Build and push scanner-worker
      # ------------------------------------------------------------------
      - name: Build and push scanner-worker
        id: push-scanner-worker
        uses: docker/build-push-action@v6
        with:
          context: ./packages/scanner-worker
          file: ./packages/scanner-worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-scanner-worker.outputs.tags }}
          labels: ${{ steps.meta-scanner-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign scanner-worker with Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign and attest scanner-worker images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "COSIGN_PRIVATE_KEY not set — skipping signing for scanner-worker."
            exit 0
          fi
          echo "$COSIGN_PRIVATE_KEY" | cosign sign --yes --key - \
            ${{ env.IMAGE_PREFIX }}/scanner-worker:${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Build and push admin-ui
      # ------------------------------------------------------------------
      - name: Build and push admin-ui
        id: push-admin-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/admin-ui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-admin-ui.outputs.tags }}
          labels: ${{ steps.meta-admin-ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign and attest admin-ui images
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "COSIGN_PRIVATE_KEY not set — skipping signing for admin-ui."
            exit 0
          fi
          echo "$COSIGN_PRIVATE_KEY" | cosign sign --yes --key - \
            ${{ env.IMAGE_PREFIX }}/admin-ui:${{ github.ref_name }}

      # ------------------------------------------------------------------
      # Publish GitHub Release with install.sh as an asset.
      #
      # The customer-facing install URL is
      #   https://github.com/SGridworks/agentworks-os/releases/download/<tag>/install.sh
      # — referenced from README and docs. Uploading the asset here keeps
      # the URL valid for every future tag without a manual step.
      # ------------------------------------------------------------------
      - name: Publish GitHub Release with install.sh
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.ref || github.ref_name }}
          files: apps/installer/src/install.sh
          fail_on_unmatched_files: true
          generate_release_notes: true

      # ------------------------------------------------------------------
      # Make the just-published GHCR packages public so unauthenticated
      # `docker compose pull` works for end users. Idempotent — flipping a
      # package that's already public is a no-op (the API returns 204).
      # Requires the workflow's GITHUB_TOKEN to have `packages: write`,
      # which is granted at the top of this file.
      # ------------------------------------------------------------------
      - name: Make GHCR packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in agentworks/agentos-d agentworks/scanner-worker agentworks/admin-ui; do
            gh api -X PATCH \
              "/user/packages/container/${pkg//\//%2F}/visibility" \
              -f visibility=public \
              || echo "  warn: could not set ${pkg} public (may already be public, or owner is an org)"
          done
