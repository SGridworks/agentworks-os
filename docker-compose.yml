# AgentWorks OS — Docker Compose
#
# Services:
#   agentos-d       Main substrate daemon (REST API + MCP)
#   postgres       Local execution database
#   scanner-worker  AgentGuard Python sidecar
#   n8n            Workflow automation
#
# Usage:
#   docker compose up -d
#   docker compose logs -f agentos-d
#   docker compose down
#
services:
  # --------------------------------------------------------------------------
  # agentos-d — main substrate daemon
  # --------------------------------------------------------------------------
  agentos-d:
    build:
      context: ${AGENTWORKS_SOURCE_DIR:-.}
      dockerfile: packages/agentos-d/Dockerfile
    image: ghcr.io/sgridworks/agentworks-os-v0.3/agentos-d:${AGENTWORKS_VERSION:-0.3.0-alpha.1}
    container_name: agentos-d
    restart: unless-stopped
    ports:
      # Bound to loopback: the raw API (incl. operator memory + approval controls)
      # must not be reachable from the LAN. Sibling containers reach it over the
      # bridge network by service name. To expose deliberately, override the bind
      # address AND set AGENTOS_API_KEY + AGENTOS_REQUIRE_TOKEN=true.
      - "127.0.0.1:7710:7710"   # REST + MCP
    environment:
      AGENTOS_HOST: "0.0.0.0"
      AGENTOS_PORT: "7710"
      AGENTOS_LOG_LEVEL: ${AGENTOS_LOG_LEVEL:-info}
      AGENTOS_AWCP_VERSION: ${AGENTOS_AWCP_VERSION:-awcp/v0.1}
      RULE_PACKS_DIR: /opt/agentworks/rule-packs
      VAULT_ROOT: /data/vault
      AGENTOS_DATA_DIR: /data
      AGENTOS_API_KEY: ${AGENTOS_API_KEY:-local-trusted}
    volumes:
      - ${AGENTWORKS_DATA_DIR:-./data}:/data            # SQLite DB, WAL, vault, uploads
      - ${AGENTWORKS_CONFIG_DIR:-./config}:/config:ro    # .env and secrets (read-only at runtime)
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7710/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - agentworks

  # --------------------------------------------------------------------------
  # scanner-worker — AgentGuard Python sidecar
  # --------------------------------------------------------------------------
  scanner-worker:
    build:
      context: ${AGENTWORKS_SOURCE_DIR:-.}/packages/scanner-worker
      dockerfile: Dockerfile
    image: ghcr.io/sgridworks/agentworks-os-v0.3/scanner-worker:${AGENTWORKS_VERSION:-0.3.0-alpha.1}
    container_name: scanner-worker
    restart: unless-stopped
    ports:
      - "3101:3101"   # Health + findings API
    environment:
      SCANNER_WORKER_PORT: "3101"
      SCANNER_SIDECAR_URL: "http://agentos-d:7710"
      SCANNER_POLL_INTERVAL_MS: "30000"
      # Paths watched by the scanner
      SCANNER_WATCH_DIRS: "/config/claude,/config/cursor"
    volumes:
      - ${AGENTWORKS_CONFIG_DIR:-./config}:/config:ro        # Agent configs to scan (CLAUDE.md, .cursorrules, etc.)
      - ${AGENTWORKS_DATA_DIR:-./data}/scanner:/var/lib/scanner  # Scan state + findings cache
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:3101/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agentworks

  # --------------------------------------------------------------------------
  # admin-ui — Next.js admin interface
  # --------------------------------------------------------------------------
  admin-ui:
    build:
      context: ${AGENTWORKS_SOURCE_DIR:-.}
      dockerfile: packages/admin-ui/Dockerfile
    image: ghcr.io/sgridworks/agentworks-os-v0.3/admin-ui:${AGENTWORKS_VERSION:-0.3.0-alpha.1}
    container_name: agentworks-admin-ui
    restart: unless-stopped
    ports:
      # Loopback-only by default — the UI proxies to the unauthenticated API, so
      # exposing it to the LAN would re-expose agentos-d. Reach it via localhost
      # or an SSH tunnel; expose deliberately only behind your own auth.
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Target the daemon by service name over the bridge network. Without this
      # the Next proxy falls back to 127.0.0.1, which inside this container is
      # the UI itself, not the daemon.
      AGENTOS_API_URL: "http://agentos-d:7710"
      AGENTOS_API_KEY: ${AGENTOS_API_KEY:-local-trusted}
    depends_on:
      agentos-d:
        condition: service_healthy
    networks:
      - agentworks

# ------------------------------------------------------------------------------
# Networks
# ------------------------------------------------------------------------------
networks:
  agentworks:
    name: agentworks
    driver: bridge

# ------------------------------------------------------------------------------
# Volumes
# ------------------------------------------------------------------------------
volumes: {}
